{% import "macros.html" as macros %}

<!-- Unset these two properties so that the entries become visible  -->
<style>
    :root {
        --fc-page-bg-color: unset;
        --fc-list-event-hover-bg-color: unset;
    }
</style>


<div id='calendar'></div>
<br>
<script src='{{ macros::rel_url(path="/js/fullcalendar-6.1.18/index.global.min.js") }}'
        integrity="sha384-{{ get_hash(path="/js/fullcalendar-6.1.18/index.global.min.js", sha_type=384, base64=true) | safe }}">
</script>
<script src='{{ macros::rel_url(path="/js/fullcalendar-6.1.18/google-calendar/index.global.min.js") }}'
        integrity="sha384-{{ get_hash(path="/js/fullcalendar-6.1.18/google-calendar/index.global.min.js", sha_type=384, base64=true) | safe }}">
</script>

<script>
    var calendar_config = {
        googleCalendarApiKey: '{{ config.extra.google_api_key }}',
        locale: 'de',
        initialView: 'listMonth',
        events: {
            googleCalendarId: '{{ config.extra.google_cal_id }}',
        },
    };

    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, calendar_config);
        calendar.render();
    });
</script>
