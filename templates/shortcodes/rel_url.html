{% import "macros.html" as macros %}

{%- if not lang -%}
    {%- set lang = config.default_language -%}
{%- endif -%}

{%- if path is containing("@/") -%}
    <a href="{{ macros::rel_url(path=path, lang=lang) }}">
        {{ body }}
    </a>
{%- else -%}
    <a rel="noopener nofollow noreferrer" target="_blank" href="">
        {{ body }}
    </a>
{%- endif -%}
