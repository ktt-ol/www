<aside class="d-flex flex-column gap-3 mb-auto">

    <section>
        <h3 class="mb-2">
            <a class="ms-2" href="//status.mainframe.io">Space-Status</a>
        </h3>

        <div id="space-status" class="px-2 small list-group">
            <template id="status-item-template">
                <a class="list-group-item border rounded-3" href="//status.mainframe.io">
                    <div class="status-text d-none fw-semibold" data-state="unknown">???</div>
                    <div class="status-text d-none fw-semibold"
                         data-state="closed">{{ trans(key="closed",   lang=lang) }}</div>
                    <div class="status-text d-none fw-semibold"
                         data-state="closing">{{ trans(key="closing",  lang=lang) }}</div>
                    <div class="status-text d-none fw-semibold"
                         data-state="open">{{ trans(key="open",     lang=lang) }}</div>
                    <div class="status-text d-none fw-semibold"
                         data-state="member">{{ trans(key="member",   lang=lang) }}</div>
                    <div class="status-text d-none fw-semibold"
                         data-state="keyholder">{{ trans(key="keyholder",lang=lang) }}</div>
                </a>
            </template>
        </div>
    </section>

    <section>
        <h3 class="mb-2">
            <a class="ms-2" href="{{ get_url(path='@/calendar.md', lang=lang) }}">Nächste Termine</a>
        </h3>

        <div class="px-2 small">
            <ul
                    class="list-group"
                    id="event-list"
                    data-calendar-id="{{ config.extra.google_cal_id }}"
                    data-api-key="{{ config.extra.google_api_key }}"
                    data-max="5"
            ></ul>

            <template id="event-item-template">
                <li class="list-group-item">
                    <div class="row g-3 align-items-start">
                        <div class="col-5 col-md-4 col-lg-5">
                            <div class="d-flex flex-column text-nowrap">
                                <time class="event-date text-secondary small"></time>
                                <time class="event-time text-secondary small"></time>
                            </div>
                        </div>
                        <div class="col position-relative">
                            <b>
                                <a
                                        class="event-link stretched-link text-reset text-decoration-none focus-ring"
                                        target="_blank"
                                        rel="noopener"
                                ></a>
                            </b>
                        </div>
                    </div>
                </li>
            </template>

            <template id="event-empty-template">
                <li class="list-group-item">Keine Termine</li>
            </template>

            <template id="event-error-template">
                <li class="list-group-item">Could not load events.</li>
            </template>
        </div>
    </section>
</aside>
